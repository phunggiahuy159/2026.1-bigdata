# Danh mục thương hiệu Việt Nam bị mạo danh (v1, P3).
# Quy ước:
#   brand_id          khoá duy nhất, chữ thường [a-z0-9_]
#   name              tên hiển thị
#   category          bank | finance | ewallet | ecommerce | telecom | gov | logistics | game | insurance | service
#   official_domains  CHỈ domain chính thức (eTLD+1). Không bao giờ ghi domain lừa đảo.
#   keywords          chuỗi dùng để so khớp/khoảng cách chỉnh sửa trong tên miền (không dấu, thường)
#   aliases           biến thể viết tắt / cách gọi thông dụng
#   Keyword/alias ngắn (< 5 ký tự) chỉ nên khớp nguyên token; ghi chú ở note nếu dễ nhiễu.
#   brand_id dùng làm key Kafka alerts.v1.brand_id, Mongo domains.brand_id, Redis cnt:{brand}:{minute}
#   verified          true = official_domains đã đối chiếu nguồn công khai (trang chính chủ, Wikipedia,
#                      cơ quan nhà nước hoặc danh bạ hội viên Hiệp hội Ngân hàng) và ghi ở `source`;
#                      false = chưa xác nhận hết, bắt buộc có `note` nói chỗ cần kiểm
#   source            URL nguồn chính của lần xác minh (bắt buộc khi verified: true)
#   note              chỗ chưa chắc, domain đã bỏ/chưa thêm và lý do
#   Xác minh bằng tìm kiếm web, chỉ mở trang chính chủ hoặc Wikipedia; không mở domain lấy từ luồng chứng chỉ.

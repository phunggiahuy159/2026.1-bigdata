# Danh mục thương hiệu Việt Nam bị mạo danh (v1, P3).
# Quy ước:
#   brand_id          khoá duy nhất, chữ thường [a-z0-9_]
#   name              tên hiển thị
#   category          bank | ewallet | ecommerce | telecom | gov | logistics
#   official_domains  CHỈ domain chính thức (eTLD+1). Không bao giờ ghi domain lừa đảo.
#   keywords          chuỗi dùng để so khớp/khoảng cách chỉnh sửa trong tên miền (không dấu, thường)
#   aliases           biến thể viết tắt / cách gọi thông dụng
#   verified          false = domain/từ khoá soạn từ kiến thức sẵn có, CHƯA kiểm lại
#                     (không fetch site theo luật nhóm); true khi đã đối chiếu nguồn công khai
#   note              chỗ chưa chắc cần người kiểm

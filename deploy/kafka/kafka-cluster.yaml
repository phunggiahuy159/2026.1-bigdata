# kubectl apply -n kafka -f deploy/kafka/kafka-cluster.yaml  (sau khi operator chạy)
# KRaft, 1 node vừa controller vừa broker. Bootstrap: bigd-kafka-kafka-bootstrap.kafka.svc:9092
# Topic ct.raw / ct.dlq / alerts.v1 do P2 và P3 tạo bằng KafkaTopic theo contracts/kafka.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    strimzi.io/cluster: bigd-kafka
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: persistent-claim
    size: 60Gi
    class: bigd-data
    deleteClaim: false
    selector:
      bigd.volume: kafka
  jvmOptions:
    -Xms: 1536m
    -Xmx: 1536m
  resources:
    requests:
      cpu: "1"
      memory: 3Gi
    limits:
      cpu: "2"
      memory: 3Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: bigd-kafka
spec:
  kafka:
    version: 4.2.2
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
      num.partitions: 6
      log.retention.hours: 48
      compression.type: producer
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 256Mi

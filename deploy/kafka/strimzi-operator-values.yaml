# helm upgrade --install strimzi strimzi/strimzi-kafka-operator --version 1.3.0 -n kafka
# Operator chỉ theo dõi namespace `kafka`. Image mặc định quay.io/strimzi/operator:1.3.0
# (defaultImageTag ghim cùng phiên bản chart).
replicas: 1
watchNamespaces: []
watchAnyNamespace: false

defaultImageRegistry: quay.io
defaultImageRepository: strimzi
defaultImageTag: 1.3.0

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 384Mi

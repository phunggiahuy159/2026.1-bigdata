# helm upgrade --install iceberg-catalog lakekeeper/lakekeeper --version 0.12.0 -n iceberg \
#   -f deploy/iceberg-catalog/values.yaml
# Lakekeeper (Iceberg REST catalog, image quay.io/lakekeeper/catalog:v0.13.3) với PostgreSQL
# đi kèm chart (groundhog2k/postgres, image chính thức docker.io/postgres).
# Mật khẩu và khoá mã hoá lấy từ Secret do `make secrets` tạo từ .env.
# Không chạy `helm test`: Pod test của chart dùng curlimages/curl:latest, không resources.
# Chưa bật xác thực (auth.* để trống): chỉ truy cập trong cụm, NetworkPolicy ở tuần 5.
# Job migration mặc định là hook post-install: với `helm --wait` thì Deployment đợi check-db,
# check-db đợi migration, migration đợi Deployment sẵn sàng nên kẹt đến hết timeout.
# helmWait: true biến migration thành Job thường chạy song song với Deployment.
helmWait: true

lakekeeper:
  edition: core

catalog:
  image:
    tag: v0.13.3
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  dbMigrations:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  initContainers:
    checkDb:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi

secretBackend:
  type: Postgres
  postgres:
    encryptionKeySecret: catalog-encryption
    encryptionKeySecretKey: encryptionKey

postgresql:
  enabled: true
  nameOverride: lakekeeper-pg
  image:
    tag: "18.6"
  service:
    port: 5432
  settings:
    existingSecret: catalog-postgres
    superuser:
      secretKey: superuser
    superuserPassword:
      secretKey: superuser-password
  userDatabase:
    existingSecret: catalog-postgres
    name:
      secretKey: database
    user:
      secretKey: user
    password:
      secretKey: password
  storage:
    persistentVolumeClaimName: catalog-postgres-data
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  initResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
